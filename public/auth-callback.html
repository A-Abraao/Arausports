<!doctype html>
<html>
  <head><meta charset="utf-8"/><title>Auth callback</title></head>
  <body>
    <script>
      const payload = (window.location.hash || window.location.search || "").replace(/^#/, "");
      const bc = new BroadcastChannel("supabase-auth-popup");
      bc.postMessage(payload); // envia o hash de tokens/código
      setTimeout(() => window.close(), 100);
    </script>

  </body>
</html>
